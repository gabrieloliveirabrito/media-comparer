# conf.d is included inside http {} — map is valid here.
map $http_x_forwarded_proto $site_scheme {
  default $scheme;
  https   https;
  http    http;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Required for ffmpeg.wasm (SharedArrayBuffer / cross-origin isolation)
  add_header Cross-Origin-Opener-Policy same-origin always;
  add_header Cross-Origin-Embedder-Policy require-corp always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Rewrite __SITE_ORIGIN__ in HTML to the live request origin so OG/Twitter
  # work for any Coolify/custom domain without rebuilding the image.
  # (text/html is the default sub_filter type — do not re-list it)
  sub_filter '__SITE_ORIGIN__' '${site_scheme}://$host';
  sub_filter_once off;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  location = /index.html {
    add_header Cache-Control "no-store" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
    try_files /index.html =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /ffmpeg/ {
    default_type application/octet-stream;
    types {
      application/javascript js;
      application/wasm wasm;
    }
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
    add_header Cross-Origin-Resource-Policy same-origin always;
    try_files $uri =404;
  }

  location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2|wasm)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
    add_header Cross-Origin-Resource-Policy same-origin always;
    try_files $uri =404;
  }
}
