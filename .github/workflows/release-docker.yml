name: Release Docker Image

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semver bump
        required: true
        default: patch
        type: choice
        options:
          - major
          - minor
          - patch
      strip_source_maps:
        description: Remove *.map from the image
        required: true
        default: true
        type: boolean
      dry_run:
        description: Compute version only (no commit/tag/push/image)
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/media-comparer

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bump version
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          CURRENT=$(node -p "require('./package.json').version")
          IFS=. read -r MAJOR MINOR PATCH <<<"$CURRENT"
          case "$BUMP" in
            major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR+1)); PATCH=0 ;;
            patch) PATCH=$((PATCH+1)) ;;
          esac
          NEW="${MAJOR}.${MINOR}.${PATCH}"
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "Bumping $CURRENT -> $NEW"
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run — stopping before git/docker changes."
            exit 0
          fi
          NEW_VERSION="$NEW" node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version=process.env.NEW_VERSION;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"

      - name: Commit, branch, tag
        if: ${{ inputs.dry_run == false }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.bump.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "release/${VERSION}"
          git add package.json
          git commit -m "chore(release): v${VERSION}"
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin "release/${VERSION}"
          git push origin "v${VERSION}"
          git checkout main
          git merge --ff-only "release/${VERSION}"
          git push origin main

      - name: Log in to GHCR
        if: ${{ inputs.dry_run == false }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: ${{ inputs.dry_run == false }}
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        if: ${{ inputs.dry_run == false }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.bump.outputs.version }}
            type=raw,value=v${{ steps.bump.outputs.version }}
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push
        if: ${{ inputs.dry_run == false }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_APP_VERSION=${{ steps.bump.outputs.version }}
            VITE_IMAGE_VERSION=${{ steps.bump.outputs.version }}
            VITE_SITE_URL=${{ vars.VITE_SITE_URL || 'https://example.com' }}
            VITE_AUTHOR_NAME=${{ vars.VITE_AUTHOR_NAME || 'Gabriel Oliveira Brito' }}
            STRIP_SOURCE_MAPS=${{ inputs.strip_source_maps }}
